<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Chip con un rayo: no somos el límite, somos la chispa, estilo punk monocromático">
  <rect width="1200" height="420" fill="#0b0b0b"/>
  <rect x="6" y="6" width="1188" height="408" fill="none" stroke="#efefef" stroke-width="3"/>

  <text x="40" y="74" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#8a8a8a" letter-spacing="2">lab217:~$ fork &amp;&amp; mejora</text>
  <text x="1160" y="74" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#555">[ 05 ]</text>

  <!-- trazas simples conectando a los pines exteriores -->
  <g stroke="#555" stroke-width="3" fill="none">
    <path d="M60 180 H476"/>
    <path d="M60 240 H476"/>
    <path d="M1140 180 H724"/>
    <path d="M1140 240 H724"/>
    <circle cx="60" cy="180" r="5" fill="#555"/>
    <circle cx="60" cy="240" r="5" fill="#555"/>
    <circle cx="1140" cy="180" r="5" fill="#555"/>
    <circle cx="1140" cy="240" r="5" fill="#555"/>
  </g>

  <!-- chip + rayo (rayo contenido dentro del chip) -->
  <g transform="translate(600 210)">
    <rect x="-100" y="-62" width="200" height="124" rx="6" fill="#0b0b0b" stroke="#efefef" stroke-width="6"/>
    <g fill="#efefef">
      <rect x="-124" y="-36" width="24" height="12"/><rect x="-124" y="24" width="24" height="12"/>
      <rect x="100" y="-36" width="24" height="12"/><rect x="100" y="24" width="24" height="12"/>
    </g>
    <polygon points="12,-46 -24,6 6,6 -10,46 30,-4 4,-4" fill="#ff2a1a"/>
  </g>

  <text x="600" y="368" text-anchor="middle" textLength="960" lengthAdjust="spacingAndGlyphs"
        font-family="Impact, 'Roboto Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="50" fill="#ffffff">NO SOMOS EL LÍMITE — SOMOS LA CHISPA</text>
</svg>
