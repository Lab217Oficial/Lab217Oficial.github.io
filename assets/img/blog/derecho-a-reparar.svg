<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Insignia con un cautín: Derecho a Reparar, estilo punk monocromático plano">
  <rect width="1200" height="420" fill="#0b0b0b"/>
  <rect x="6" y="6" width="1188" height="408" fill="none" stroke="#efefef" stroke-width="3"/>

  <!-- emblema: cautín plano 2D -->
  <g transform="translate(206 210)">
    <circle r="134" fill="none" stroke="#efefef" stroke-width="8"/>
    <circle r="118" fill="none" stroke="#2a2a2a" stroke-width="2"/>

    <g transform="rotate(-38)">
      <!-- cable -->
      <path d="M0 -104 C 34 -120 72 -104 64 -70" fill="none" stroke="#8a8a8a" stroke-width="7" stroke-linecap="round"/>

      <!-- mango -->
      <rect x="-26" y="-108" width="52" height="78" rx="18" fill="#d0d0d0"/>
      <!-- estrías del mango (plano, líneas cortadas) -->
      <g stroke="#0b0b0b" stroke-width="4">
        <line x1="-26" y1="-86" x2="26" y2="-86"/>
        <line x1="-26" y1="-70" x2="26" y2="-70"/>
        <line x1="-26" y1="-54" x2="26" y2="-54"/>
      </g>

      <!-- cuello / tuerca -->
      <rect x="-16" y="-32" width="32" height="14" fill="#8a8a8a"/>

      <!-- barril metálico -->
      <rect x="-10" y="-18" width="20" height="74" fill="#b4b4b4"/>

      <!-- punta caliente (roja) -->
      <polygon points="-10,56 10,56 0,110" fill="#ff2a1a"/>
    </g>
  </g>

  <!-- texto -->
  <g font-family="Impact, 'Roboto Condensed', 'Arial Narrow', sans-serif" font-weight="700">
    <text x="430" y="172" font-size="96" textLength="430" lengthAdjust="spacingAndGlyphs" fill="#efefef">DERECHO</text>
    <text x="430" y="270" font-size="96" textLength="620" lengthAdjust="spacingAndGlyphs" fill="#ffffff">A REPARAR</text>
  </g>
  <rect x="432" y="296" width="440" height="12" fill="#ff2a1a"/>
  <text x="432" y="344" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21" fill="#8a8a8a" letter-spacing="3">// si no lo puedes abrir, no es tuyo</text>
</svg>
